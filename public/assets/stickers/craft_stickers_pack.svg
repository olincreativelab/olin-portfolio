<svg width="480" height="120" viewBox="0 0 480 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- STICKER 1 : BÉZIER / VECTOR CRAFT -->
  <g id="sticker-bezier" transform="translate(10, 10)">
    <!-- Contour Sticker Découpé Blanc + Ombre Portée -->
    <rect x="0" y="0" width="100" height="100" rx="20" fill="#FFFFFF" stroke="#01050F" stroke-width="2.5" />
    <rect x="3" y="3" width="100" height="100" rx="20" fill="#01050F" opacity="0.08" />
    
    <!-- Courbe de Bézier -->
    <path d="M 22 75 C 22 35, 78 65, 78 25" stroke="#4E4BF5" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Ligne de tangente -->
    <line x1="28" y1="38" x2="72" y2="62" stroke="#626D82" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Poignée 1 -->
    <circle cx="28" cy="38" r="4.5" fill="#FFFFFF" stroke="#4E4BF5" stroke-width="2"/>
    <!-- Poignée 2 -->
    <circle cx="72" cy="62" r="4.5" fill="#FFFFFF" stroke="#4E4BF5" stroke-width="2"/>
    <!-- Point d'ancrage central (Carré) -->
    <rect x="46" y="46" width="8" height="8" fill="#01050F" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Label discret -->
    <text x="50" y="90" font-family="monospace" font-size="8.5" font-weight="bold" fill="#626D82" text-anchor="middle" letter-spacing="1">CRAFT</text>
  </g>

  <!-- STICKER 2 : MASTER COMPONENT FIGMA / DESIGN SYSTEM -->
  <g id="sticker-component" transform="translate(130, 10)">
    <!-- Contour Sticker Découpé Blanc + Ombre Portée -->
    <rect x="0" y="0" width="100" height="100" rx="20" fill="#FFFFFF" stroke="#01050F" stroke-width="2.5" />
    <rect x="3" y="3" width="100" height="100" rx="20" fill="#01050F" opacity="0.08" />
    
    <!-- Symbole 4 Losanges Composant Figma -->
    <g transform="translate(50, 46)">
      <!-- Losange Haut -->
      <polygon points="0,-16 11,-5 0,6 -11,-5" fill="#5B50F6"/>
      <!-- Losange Bas -->
      <polygon points="0,16 11,5 0,-6 -11,5" fill="#5B50F6"/>
      <!-- Losange Gauche -->
      <polygon points="-16,0 -5,-11 6,0 -5,11" fill="#5B50F6"/>
      <!-- Losange Droite -->
      <polygon points="16,0 5,-11 -6,0 5,11" fill="#5B50F6"/>
      <!-- Noyau central blanc -->
      <polygon points="0,-4 4,0 0,4 -4,0" fill="#FFFFFF"/>
    </g>
    <!-- Label discret -->
    <text x="50" y="90" font-family="monospace" font-size="8.5" font-weight="bold" fill="#626D82" text-anchor="middle" letter-spacing="1">SYSTEM</text>
  </g>

  <!-- STICKER 3 : CHEVRONS CODE & BUILDER -->
  <g id="sticker-code" transform="translate(250, 10)">
    <!-- Contour Sticker Découpé Blanc + Ombre Portée -->
    <rect x="0" y="0" width="100" height="100" rx="20" fill="#FFFFFF" stroke="#01050F" stroke-width="2.5" />
    <rect x="3" y="3" width="100" height="100" rx="20" fill="#01050F" opacity="0.08" />
    
    <!-- Chevrons </> -->
    <g transform="translate(18, 28)">
      <!-- Chevron Gauche < -->
      <path d="M 22 14 L 10 24 L 22 34" stroke="#01050F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Slash / -->
      <path d="M 28 38 L 36 10" stroke="#00F5A0" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Chevron Droit > -->
      <path d="M 42 14 L 54 24 L 42 34" stroke="#01050F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <!-- Label discret -->
    <text x="50" y="90" font-family="monospace" font-size="8.5" font-weight="bold" fill="#626D82" text-anchor="middle" letter-spacing="1">BUILDER</text>
  </g>

  <!-- STICKER 4 : AUTO-LAYOUT & STRUCTURE GRID -->
  <g id="sticker-layout" transform="translate(370, 10)">
    <!-- Contour Sticker Découpé Blanc + Ombre Portée -->
    <rect x="0" y="0" width="100" height="100" rx="20" fill="#FFFFFF" stroke="#01050F" stroke-width="2.5" />
    <rect x="3" y="3" width="100" height="100" rx="20" fill="#01050F" opacity="0.08" />
    
    <!-- Pictogramme Auto-Layout Figma / Alignement -->
    <g transform="translate(25, 26)">
      <!-- Boîte Frame extérieure pointillée -->
      <rect x="0" y="0" width="50" height="46" rx="6" fill="#F3F5FB" stroke="#4E4BF5" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- Élément A intérieur -->
      <rect x="7" y="9" width="15" height="28" rx="3" fill="#5B50F6" stroke="#01050F" stroke-width="1.5"/>
      <!-- Élément B intérieur -->
      <rect x="28" y="9" width="15" height="28" rx="3" fill="#00F5A0" stroke="#01050F" stroke-width="1.5"/>
      <!-- Flèche d'espacement (gap) entre les deux -->
      <path d="M 22 23 L 28 23" stroke="#01050F" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- Label discret -->
    <text x="50" y="90" font-family="monospace" font-size="8.5" font-weight="bold" fill="#626D82" text-anchor="middle" letter-spacing="1">LAYOUT</text>
  </g>
</svg>
